<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Anti Rival</title>

    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
        }


        body {
            min-height: 100vh;
            width: 100%;

            overflow: hidden;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: white;

            position: relative;

            /* ★ 화면 중앙 정렬 */
            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(110, 130, 240, 0.55),
                    transparent 38%
                ),
                radial-gradient(
                    circle at 80% 25%,
                    rgba(105, 80, 220, 0.45),
                    transparent 40%
                ),
                radial-gradient(
                    circle at 45% 90%,
                    rgba(130, 150, 250, 0.5),
                    transparent 45%
                ),
                linear-gradient(
                    135deg,
                    #5668a8,
                    #7184c1 45%,
                    #46599a
                );
        }


        /* =========================================
           BACKGROUND
           ========================================= */

        .background {
            position: fixed;
            inset: 0;

            overflow: hidden;

            pointer-events: none;

            z-index: 0;
        }


        .light {
            position: absolute;

            width: 650px;
            height: 650px;

            border-radius: 50%;

            filter: blur(110px);

            opacity: 0.32;

            mix-blend-mode: screen;

            will-change: transform;
        }


        .light.one {
            top: -280px;
            left: -180px;

            background:
                rgba(190, 205, 255, 0.8);

            animation:
                floatOne 14s
                ease-in-out
                infinite alternate;
        }


        .light.two {
            top: 5%;
            right: -330px;

            background:
                rgba(125, 130, 255, 0.8);

            animation:
                floatTwo 17s
                ease-in-out
                infinite alternate;
        }


        .light.three {
            bottom: -380px;
            left: 15%;

            background:
                rgba(180, 200, 255, 0.7);

            animation:
                floatThree 20s
                ease-in-out
                infinite alternate;
        }


        @keyframes floatOne {

            from {
                transform:
                    translate(-20px, -20px)
                    scale(1);
            }

            to {
                transform:
                    translate(170px, 100px)
                    scale(1.12);
            }
        }


        @keyframes floatTwo {

            from {
                transform:
                    translate(30px, -20px)
                    scale(1);
            }

            to {
                transform:
                    translate(-160px, 130px)
                    scale(1.1);
            }
        }


        @keyframes floatThree {

            from {
                transform:
                    translate(-80px, 20px)
                    scale(1);
            }

            to {
                transform:
                    translate(130px, -100px)
                    scale(1.15);
            }
        }


        /* =========================================
           BINARY LAYER
           ========================================= */

        .binary-layer {
            position: fixed;

            top: -100px;
            left: -100px;

            width:
                calc(100% + 200px);

            height:
                calc(100% + 200px);

            pointer-events: none;

            z-index: 1;

            will-change: transform;

            transition:
                transform 0.5s
                cubic-bezier(
                    0.22,
                    1,
                    0.36,
                    1
                );
        }


        .binary-grid {
            position: absolute;

            inset: 0;

            display: grid;

            grid-template-columns:
                repeat(30, 1fr);

            grid-auto-rows: 21px;

            padding: 30px;

            opacity: 0.32;

            mask-image:
                radial-gradient(
                    ellipse at center,
                    black 0%,
                    rgba(0,0,0,0.85) 42%,
                    transparent 78%
                );

            -webkit-mask-image:
                radial-gradient(
                    ellipse at center,
                    black 0%,
                    rgba(0,0,0,0.85) 42%,
                    transparent 78%
                );
        }


        .binary-grid span {
            font-family:
                "Courier New",
                monospace;

            font-size: 10px;

            color:
                rgba(255,255,255,0.38);

            text-align: center;

            user-select: none;

            transition:
                opacity 0.25s ease,
                transform 0.25s ease,
                text-shadow 0.25s ease;

            will-change:
                opacity,
                transform;
        }


        /* =========================================
           MOUSE LIGHT
           ========================================= */

        .mouse-light {
            position: fixed;

            width: 520px;
            height: 520px;

            left: 0;
            top: 0;

            transform:
                translate(
                    calc(var(--mouse-x, 50vw) - 260px),
                    calc(var(--mouse-y, 50vh) - 260px)
                );

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(205,215,255,0.24) 0%,
                    rgba(150,170,255,0.13) 28%,
                    transparent 70%
                );

            filter: blur(25px);

            transition:
                transform 0.35s ease-out;

            pointer-events: none;

            z-index: 2;
        }


        /* =========================================
           MAIN CONTAINER
           ========================================= */

        .container {
            position: relative;

            z-index: 5;

            width: 90%;

            max-width: 900px;

            /* ★ 확실한 가로 중앙 */
            margin: 0 auto;

            text-align: center;
        }


        .logo {
            margin-bottom: 18px;

            font-size: 15px;

            font-weight: bold;

            letter-spacing: 6px;

            color:
                rgba(255,255,255,0.65);
        }


        h1 {
            margin: 0;

            font-size:
                clamp(
                    55px,
                    10vw,
                    100px
                );

            font-weight: 900;

            letter-spacing: 5px;

            color: white;

            text-shadow:
                0 8px 35px
                rgba(25,35,100,0.38);
        }


        .subtitle {
            margin-top: 14px;

            margin-bottom: 42px;

            font-size: 17px;

            letter-spacing: 1px;

            color:
                rgba(255,255,255,0.74);
        }


        /* =========================================
           BUTTONS
           ========================================= */

        .buttons {
            display: flex;

            justify-content: center;

            align-items: center;

            gap: 16px;

            flex-wrap: wrap;
        }


        button {
            position: relative;

            overflow: hidden;

            min-width: 210px;

            padding:
                17px 30px;

            border-radius: 14px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease;
        }


        /* =========================================
           BUTTON MOUSE SHINE
           ========================================= */

        button::before {
            content: "";

            position: absolute;

            width: 180px;
            height: 180px;

            left:
                var(--button-x, 50%);

            top:
                var(--button-y, 50%);

            transform:
                translate(-50%, -50%);

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(255,255,255,0.38),
                    transparent 65%
                );

            opacity: 0;

            pointer-events: none;

            transition:
                opacity 0.2s ease;
        }


        button:hover::before {
            opacity: 1;
        }


        button span {
            position: relative;

            z-index: 2;
        }


        /* Premium */

        .premium {
            border: none;

            background:
                rgba(255,255,255,0.95);

            color: #52669e;

            box-shadow:
                0 15px 40px
                rgba(35,50,120,0.2);
        }


        /* Free */

        .free {
            border:
                1px solid
                rgba(255,255,255,0.38);

            background:
                rgba(60,75,145,0.3);

            color: white;

            backdrop-filter:
                blur(12px);

            -webkit-backdrop-filter:
                blur(12px);

            box-shadow:
                0 15px 40px
                rgba(35,50,120,0.16);
        }


        button:hover {
            transform:
                translateY(-5px)
                scale(1.015);

            box-shadow:
                0 22px 55px
                rgba(30,45,120,0.34);
        }


        button:active {
            transform:
                translateY(-1px)
                scale(0.99);
        }


        /* =========================================
           FOOTER
           ========================================= */

        .footer {
            margin-top: 50px;

            font-size: 13px;

            color:
                rgba(255,255,255,0.4);
        }


        /* =========================================
           MOBILE
           ========================================= */

        @media (max-width: 650px) {

            body {
                overflow-y: auto;

                align-items: center;

                justify-content: center;
            }


            .container {
                width: 92%;

                margin:
                    0 auto;
            }


            h1 {
                font-size:
                    clamp(
                        44px,
                        14vw,
                        65px
                    );

                letter-spacing: 2px;
            }


            .subtitle {
                margin-bottom: 32px;

                font-size: 15px;
            }


            .buttons {
                flex-direction: column;

                align-items: center;

                gap: 12px;
            }


            button {
                width: 100%;

                max-width: 320px;
            }


            .binary-grid {
                grid-template-columns:
                    repeat(18, 1fr);

                grid-auto-rows: 20px;

                opacity: 0.24;
            }


            .mouse-light {
                width: 350px;
                height: 350px;

                transform:
                    translate(
                        calc(var(--mouse-x, 50vw) - 175px),
                        calc(var(--mouse-y, 50vh) - 175px)
                    );
            }
        }


        /* =========================================
           REDUCED MOTION
           ========================================= */

        @media (prefers-reduced-motion: reduce) {

            .light {
                animation: none;
            }

            .binary-layer {
                transition: none;
            }

            .mouse-light {
                display: none;
            }

            button {
                transition: none;
            }

        }

    </style>
</head>


<body>


    <!-- =========================================
         BACKGROUND
         ========================================= -->

    <div class="background">

        <div class="light one"></div>

        <div class="light two"></div>

        <div class="light three"></div>

    </div>


    <!-- =========================================
         MOUSE GLOW
         ========================================= -->

    <div
        class="mouse-light"
        id="mouseLight">
    </div>


    <!-- =========================================
         BINARY
         ========================================= -->

    <div
        class="binary-layer"
        id="binaryLayer">

        <div
            class="binary-grid"
            id="binaryGrid">
        </div>

    </div>


    <!-- =========================================
         MAIN
         ========================================= -->

    <div class="container">


        <div class="logo">
            ANTI RIVAL
        </div>


        <h1>
            ANTI RIVAL
        </h1>


        <div class="subtitle">
            Choose your key
        </div>


        <div class="buttons">


            <!-- Premium Key -->

            <button
                class="premium"
                onclick="location.href='key.html'">

                <span>
                    Premium Key
                </span>

            </button>


            <!-- Free Key -->

            <button
                class="free"
                onclick="location.href='https://link-center.net/8373580/1QODzu8DuANE'">

                <span>
                    Free Key
                </span>

            </button>


        </div>


        <div class="footer">
            © 2026 Anti Rival
        </div>


    </div>


    <script>


        /* =========================================
           BINARY GENERATOR
           ========================================= */

        const binaryGrid =
            document.getElementById(
                "binaryGrid"
            );


        const binaryCount = 700;


        for (
            let i = 0;
            i < binaryCount;
            i++
        ) {

            const span =
                document.createElement(
                    "span"
                );


            span.textContent =
                Math.random() > 0.5
                    ? "1"
                    : "0";


            span.dataset.baseOpacity =
                0.12 +
                Math.random() * 0.5;


            span.style.opacity =
                span.dataset.baseOpacity;


            span.style.transform =
                `translate(
                    ${Math.random() * 4 - 2}px,
                    ${Math.random() * 4 - 2}px
                )`;


            binaryGrid.appendChild(
                span
            );

        }


        const binaryElements =
            document.querySelectorAll(
                ".binary-grid span"
            );


        /* =========================================
           POINTER
           ========================================= */

        const root =
            document.documentElement;


        let targetX = 0;
        let targetY = 0;

        let currentX = 0;
        let currentY = 0;


        function updatePointer(
            x,
            y
        ) {


            const normalizedX =
                x / window.innerWidth -
                0.5;


            const normalizedY =
                y / window.innerHeight -
                0.5;


            targetX =
                normalizedX * -65;


            targetY =
                normalizedY * -65;


            root.style.setProperty(
                "--mouse-x",
                `${x}px`
            );


            root.style.setProperty(
                "--mouse-y",
                `${y}px`
            );


            /* =====================================
               BINARY MOUSE EFFECT
               ===================================== */

            binaryElements.forEach(
                (element) => {


                    const rect =
                        element.getBoundingClientRect();


                    const centerX =
                        rect.left +
                        rect.width / 2;


                    const centerY =
                        rect.top +
                        rect.height / 2;


                    const distance =
                        Math.sqrt(

                            Math.pow(
                                x - centerX,
                                2
                            )

                            +

                            Math.pow(
                                y - centerY,
                                2
                            )

                        );


                    const range = 230;


                    if (
                        distance < range
                    ) {


                        const strength =
                            1 -
                            distance / range;


                        element.style.opacity =
                            0.15 +
                            strength * 0.75;


                        element.style.transform =
                            `translate(
                                ${strength * 5}px,
                                ${strength * -3}px
                            )
                            scale(
                                ${1 + strength * 0.18}
                            )`;


                        element.style.textShadow =
                            `0 0 ${
                                5 + strength * 15
                            }px
                            rgba(
                                200,
                                215,
                                255,
                                ${strength * 0.8}
                            )`;


                    } else {


                        element.style.opacity =
                            element.dataset.baseOpacity;


                        element.style.transform =
                            "translate(0, 0) scale(1)";


                        element.style.textShadow =
                            "none";

                    }

                }
            );

        }


        /* Mouse */

        document.addEventListener(
            "mousemove",
            (event) => {

                updatePointer(
                    event.clientX,
                    event.clientY
                );

            }
        );


        /* Touch */

        document.addEventListener(
            "touchmove",
            (event) => {


                if (
                    !event.touches ||
                    !event.touches[0]
                ) {
                    return;
                }


                updatePointer(
                    event.touches[0].clientX,
                    event.touches[0].clientY
                );

            },
            {
                passive: true
            }
        );


        /* =========================================
           SMOOTH PARALLAX
           ========================================= */

        const binaryLayer =
            document.getElementById(
                "binaryLayer"
            );


        function animate() {


            currentX +=
                (targetX - currentX)
                * 0.07;


            currentY +=
                (targetY - currentY)
                * 0.07;


            binaryLayer.style.transform =
                `translate(
                    ${currentX}px,
                    ${currentY}px
                )`;


            requestAnimationFrame(
                animate
            );

        }


        animate();


        /* =========================================
           BUTTON SHINE
           ========================================= */

        const buttons =
            document.querySelectorAll(
                "button"
            );


        buttons.forEach(
            (button) => {


                button.addEventListener(
                    "mousemove",
                    (event) => {


                        const rect =
                            button.getBoundingClientRect();


                        const x =
                            event.clientX -
                            rect.left;


                        const y =
                            event.clientY -
                            rect.top;


                        button.style.setProperty(
                            "--button-x",
                            `${x}px`
                        );


                        button.style.setProperty(
                            "--button-y",
                            `${y}px`
                        );

                    }
                );


                /* Mobile */

                button.addEventListener(
                    "touchmove",
                    (event) => {


                        if (
                            !event.touches ||
                            !event.touches[0]
                        ) {
                            return;
                        }


                        const rect =
                            button.getBoundingClientRect();


                        const x =
                            event.touches[0].clientX -
                            rect.left;


                        const y =
                            event.touches[0].clientY -
                            rect.top;


                        button.style.setProperty(
                            "--button-x",
                            `${x}px`
                        );


                        button.style.setProperty(
                            "--button-y",
                            `${y}px`
                        );

                    },
                    {
                        passive: true
                    }
                );

            }
        );


    </script>

</body>
</html>
